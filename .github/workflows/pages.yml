name: Build, verify and deploy
on:
  push:
    branches: [main, review/figma-fidelity]
    paths: ['index.html', 'src/**', 'public/**', 'scripts/**', 'tests/**', 'package.json', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run check && npm run build
      - name: Exact source used for review
        uses: actions/upload-artifact@v4
        with:
          name: website-source
          path: |
            index.html
            src/
            public/
            scripts/
            tests/
            docs/
            package.json
            README.md
          retention-days: 7
      - name: Browser tooling
        run: |
          python -m pip install --quiet playwright
          python -m playwright install --with-deps chromium
      - name: Responsive and interaction tests
        run: npm run test
      - name: Figma geometry and full-page reference captures
        if: always()
        run: python3 tests/visual_review.py
      - name: Figma geometry and all control-width screenshots
        run: python3 tests/visual_test.py
      - name: Browser screenshots and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-review
          path: test-results/
          retention-days: 7
      - uses: actions/configure-pages@v5
        if: github.ref == 'refs/heads/main'
      - uses: actions/upload-pages-artifact@v3
        if: github.ref == 'refs/heads/main'
        with:
          path: dist
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - uses: actions/checkout@v4
      - name: Public-browser tooling
        run: |
          python -m pip install --quiet playwright
          python -m playwright install --with-deps chromium
      - name: Verify revision and public access
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: python3 tests/public_smoke.py
      - name: Public verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: public-review
          path: public-review/
          retention-days: 7
