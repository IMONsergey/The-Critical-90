name: Review and publish Critical 90
on:
  push:
    branches: [main]
    paths:
      - 'public/**'
      - 'scripts/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: critical90-pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify JavaScript syntax
        run: node --check public/app.js && node --check public/site-config.js
      - name: Install build and browser tools
        run: |
          python -m pip install --quiet pillow playwright
          python -m playwright install --with-deps chromium
      - name: Build static site
        run: python scripts/build.py
      - name: Save reviewable source snapshot
        uses: actions/upload-artifact@v4
        with:
          name: website-source
          path: |
            public/
            scripts/
            docs/
            package.json
          retention-days: 7
      - name: Test the GitHub Pages project path
        env:
          SITE_URL: http://127.0.0.1:4173/The-Critical-90/
        run: |
          mkdir -p .preview/The-Critical-90
          cp -R dist/. .preview/The-Critical-90/
          python -m http.server 4173 --directory .preview > /tmp/site-server.log 2>&1 &
          sleep 2
          python scripts/test_site.py
      - name: Save browser checks and screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-review
          path: test-results/
          retention-days: 7
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v5
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify public access without authentication
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          curl --fail --location --retry 8 --retry-delay 5 --retry-all-errors "$PAGE_URL" -o /tmp/live.html
          grep -q 'The Critical 90' /tmp/live.html
          curl --fail --location --retry 3 "$PAGE_URL/assets/hero.webp" -o /tmp/hero.webp
          echo 'Public page and local hero asset are available without authentication.'
