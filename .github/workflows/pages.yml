name: Build, verify and deploy
on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'src/**'
      - 'public/**'
      - 'scripts/**'
      - 'tests/**'
      - 'package.json'
      - '.github/workflows/pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm run check && npm run build
      - name: Exact source used for review
        uses: actions/upload-artifact@v4
        with:
          name: website-source
          path: |
            index.html
            src/
            public/
            scripts/
            tests/
            docs/
            package.json
            README.md
          retention-days: 7
      - name: Browser tooling
        run: |
          python -m pip install --quiet playwright
          python -m playwright install --with-deps chromium
      - name: Responsive and interaction tests
        run: npm run test
      - name: Figma geometry and all control-width screenshots
        run: python3 tests/visual_test.py
      - name: Browser screenshots and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-review
          path: test-results/
          retention-days: 7
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify public access
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          curl --fail --location --retry 8 --retry-delay 5 --retry-all-errors "$PAGE_URL" -o /tmp/live.html
          grep -q 'The Critical 90' /tmp/live.html
          curl --fail --location --retry 3 "${PAGE_URL}assets/hero.webp" -o /tmp/hero.webp
          echo 'Public page and hero asset verified without authentication.'
