name: Verify official font CDN
on:
  push:
    paths: ['.github/workflows/font-cdn-check.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Inspect public CDN font URLs
        shell: python
        run: |
          import urllib.request,re,json,pathlib,urllib.parse,concurrent.futures
          pages=['https://me-en.kaspersky.com/','https://www.kaspersky.com/enterprise-security','https://content.kaspersky-labs.com/']
          result=[]; urls=set()
          def read(url):
            try:
              req=urllib.request.Request(url,headers={'Origin':'https://imonsergey.github.io','User-Agent':'Mozilla/5.0'})
              res=urllib.request.urlopen(req,timeout=15)
              data=res.read().decode('utf8','ignore') if '.woff' not in url else ''
              return {'url':url,'status':res.status,'headers':dict(res.headers),'text':data}
            except Exception as e:return {'url':url,'error':str(e)}
          with concurrent.futures.ThreadPoolExecutor(max_workers=8) as pool:
            for item in pool.map(read,pages):
              text=item.pop('text','')
              item['resources']=re.findall(r'(?:href|src)=[\"\']([^\"\']+(?:css|woff2?)[^\"\']*)',text)[:40]
              result.append(item)
              for url in item['resources']:
                urls.add(urllib.parse.urljoin(item['url'],url))
          cdn='https://d3kwb303vesg1m.cloudfront.net'
          for prefix in ['/siterenderer/_next/static/media/','/_next/static/media/']:
            urls.add(cdn+prefix+'KasperskySansDisplay-Regular.f94abc02.woff2')
          with concurrent.futures.ThreadPoolExecutor(max_workers=8) as pool:
            for item in pool.map(read,urls):
              text=item.pop('text','')
              item['faces']=[f for f in re.findall(r'@font-face\s*\{[^}]+\}',text) if 'Kaspersky' in f]
              result.append(item)
          pathlib.Path('font-cdn-check.json').write_text(json.dumps(result,indent=2))
          print(json.dumps(result,indent=2)[:45000])
      - uses: actions/upload-artifact@v4
        with:
          name: font-cdn-check
          path: font-cdn-check.json
          retention-days: 2
