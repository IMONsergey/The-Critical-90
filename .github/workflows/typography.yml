name: Verify brand typography
on:
  push:
    paths: ['.github/workflows/typography.yml']
permissions:
  contents: read
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - run: pip install -q playwright
      - run: python -m playwright install --with-deps chromium
      - name: Inspect official stylesheets
        shell: python
        run: |
          import json,pathlib,asyncio,re
          from playwright.async_api import async_playwright
          async def main():
            async with async_playwright() as p:
              browser=await p.chromium.launch()
              page=await browser.new_page()
              resources=[]
              async def capture(res):
                if '.woff' in res.url or '.ttf' in res.url:
                  resources.append({'url':res.url,'status':res.status})
                if '.css' in res.url:
                  try:
                    text=await res.text()
                    for face in re.findall(r'@font-face\s*\{[^}]+\}',text):
                      resources.append({'stylesheet':res.url,'face':face})
                  except: pass
              page.on('response',capture)
              for url in ['https://esg.kaspersky.com/','https://www.kaspersky.com/enterprise-security']:
                try:
                  await page.goto(url,wait_until='domcontentloaded',timeout=45000)
                  await page.wait_for_timeout(7000)
                  resources.append({'page':url,'fonts':await page.evaluate('Array.from(document.fonts).map(f=>({family:f.family,weight:f.weight,status:f.status}))')})
                except Exception as e: resources.append({'error':str(e)[:500]})
              pathlib.Path('brand-typography.json').write_text(json.dumps(resources,indent=2))
              print(json.dumps(resources,indent=2)[:45000])
              await browser.close()
          asyncio.run(main())
      - uses: actions/upload-artifact@v4
        with:
          name: brand-typography
          path: brand-typography.json
          retention-days: 2
