name: Check font delivery
on:
  push:
    paths: ['.github/workflows/font-diagnostics.yml']
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Inspect official public font declarations and headers
        shell: python
        run: |
          import urllib.request,urllib.parse,re,json,pathlib
          result=[]
          for page in ['https://esg.kaspersky.com/','https://www.kaspersky.com/enterprise-security']:
            try:
              html=urllib.request.urlopen(page,timeout=30).read().decode()
              sources=[(page,html)]
              for link in re.findall(r'(?:href|src)=[\"\']([^\"\']+\.css[^\"\']*)',html)[:15]:
                url=urllib.parse.urljoin(page,link)
                try:sources.append((url,urllib.request.urlopen(url,timeout=30).read().decode()))
                except Exception as e:result.append({'error':str(e),'url':url})
              for url,text in sources:
                for face in re.findall(r'@font-face\s*\{[^}]+\}',text):
                  entry={'source':url,'face':face,'fonts':[]}
                  for path in re.findall(r'url\(([^)]+)\)',face):
                    fonturl=urllib.parse.urljoin(url,path.strip('"\''))
                    if not fonturl.startswith('http'):continue
                    try:
                      res=urllib.request.urlopen(urllib.request.Request(fonturl,headers={'Origin':'https://imonsergey.github.io'}),timeout=30)
                      entry['fonts'].append({'url':fonturl,'status':res.status,'headers':dict(res.headers)})
                    except Exception as e:entry['fonts'].append({'url':fonturl,'error':str(e)})
                  result.append(entry)
            except Exception as e:result.append({'page':page,'error':str(e)})
          pathlib.Path('font-diagnostics.json').write_text(json.dumps(result,indent=2))
          print(json.dumps(result,indent=2)[:50000])
      - uses: actions/upload-artifact@v4
        with:
          name: font-diagnostics
          path: font-diagnostics.json
          retention-days: 2
