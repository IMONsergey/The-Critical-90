name: First website publication
on:
  push:
    paths: ['.github/workflows/site-bootstrap.yml']
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Restore verified source files
        shell: python
        run: |
          import pathlib,base64,lzma,json,hashlib,shutil
          p=pathlib.Path
          if p('.transfer/source-1.b64').exists():
            encoded=''.join(p(f'.transfer/source-{i}.b64').read_text().strip() for i in range(1,5))
            raw=lzma.decompress(base64.b64decode(encoded))
            assert hashlib.sha256(raw).hexdigest()=='35afaf25a2577dc6fd3d55d48e80120ac78d25785ff8551d479f8f1797528905', 'Source checksum mismatch'
            files=json.loads(raw)
            for name,content in files.items():
              path=p(name)
              assert not path.is_absolute() and '..' not in path.parts
              path.parent.mkdir(parents=True,exist_ok=True)
              path.write_text(content)
            shutil.rmtree('.transfer')
            print(f'Restored and verified {len(files)} readable source files.')
          else:
            assert p('index.html').exists(), 'Website sources are missing'
          p('public/assets/font-reference.txt').unlink(missing_ok=True)
      - name: Prepare social preview
        run: |
          python -m pip install --quiet pillow
          python - <<'PY'
          from PIL import Image
          background=Image.new('RGB',(1200,630),'#081418')
          image=Image.open('public/assets/hero.webp').convert('RGBA')
          image.thumbnail((1000,630),Image.Resampling.LANCZOS)
          background.paste(image,(1200-image.width,(630-image.height)//2),image)
          background.save('public/assets/social.webp','WEBP',quality=88,method=6)
          PY
      - name: Commit readable website source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- index.html package.json README.md .gitignore src scripts tests public
          git add -u -- .transfer || true
          git diff --cached --quiet || git commit -m 'Implement responsive Critical 90 website with motion and interaction tests'
          git push
      - name: Build and syntax check
        run: npm run check && npm run build
      - name: Browser tooling
        run: |
          python -m pip install --quiet playwright
          python -m playwright install --with-deps chromium
      - name: Responsive and interaction tests
        run: npm run test
      - name: Browser screenshots and results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-review
          path: test-results/
          retention-days: 7
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
